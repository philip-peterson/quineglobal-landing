# On every push to main: build the image, push it to the forge's registry,
# and open a petersweb-infra PR that pins it (quine-global/site-image).
# Merging that PR deploys it.
#
# Runs on the forge VM's ubuntu-latest runner, which is arm64 like the VM
# the site runs on, in a privileged Podman container (vfs storage).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    container:
      image: quay.io/podman/stable
      options: --privileged
    env:
      STORAGE_DRIVER: vfs
    steps:
      - name: Tools
        run: dnf install -y --quiet git-core jq curl
      # Podman 6's image sets mount_program = fuse-overlayfs in a drop-in,
      # and it fails in the runner's job container when podman build
      # overlay-mounts the context. The job is privileged and root, so the
      # kernel's overlay works instead.
      - name: Kernel overlay, not fuse-overlayfs
        run: rm -f /etc/containers/storage.rootful.conf.d/20-image_build.conf
      # A plain clone: the container has no Node for actions/checkout. The
      # forge's public address: this runner is told localhost:3000, which
      # the container can't reach.
      - name: Checkout
        run: |
          git clone -q "https://ci:${{ github.token }}@forge.in.quineglobal.com/${{ github.repository }}.git" .
          git checkout -q "${{ github.sha }}"
      - uses: https://forge.in.quineglobal.com/quine-global/site-image@v1
        with:
          image: forge.in.quineglobal.com/quine-global/quineglobal-com
          infra-file: nixos/linux.nix
          name: quineglobal.com
          platform: linux/arm64
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          infra-token: ${{ secrets.INFRA_TOKEN }}
